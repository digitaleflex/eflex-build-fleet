name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: gofmt -w $(find . -name '*.go' -not -path './vendor/*')
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: buildfleet
          POSTGRES_USER: eflex
          POSTGRES_PASSWORD: local-dev-only-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eflex -d buildfleet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eflex:local-dev-only-change-me@localhost:5432/buildfleet?sslmode=disable
      FLEET_API_TOKEN: 01234567890123456789012345678901
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations
        run: for f in migrations/*.up.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: go test -tags integration -race ./...
