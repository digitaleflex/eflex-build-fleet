openapi: 3.1.0
info:
  title: E-FLEX Build Fleet Control Plane API
  version: 1.3.0
  description: Administrative API and per-node agent protocol.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: getLiveness
      responses:
        '200': { description: Process alive }
  /readyz:
    get:
      security: []
      operationId: getReadiness
      responses:
        '200': { description: Database ready }
        '503': { description: Database unavailable }
  /api/v1/nodes:
    post:
      operationId: registerBuildNode
      responses:
        '201': { description: Node registered }
        '409': { description: Duplicate name }
    get:
      operationId: listBuildNodes
      responses:
        '200': { description: Nodes returned }
  /api/v1/nodes/{id}/credentials:
    post:
      operationId: issueNodeCredential
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Credential issued once }
  /api/v1/jobs:
    post:
      operationId: createBuildJob
      responses:
        '201': { description: Job created }
        '200': { description: Idempotent job returned }
    get:
      operationId: listBuildJobs
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Jobs returned }
  /api/v1/jobs/{id}:
    get:
      operationId: getBuildJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Job returned }
  /api/v1/scheduler/dispatch:
    post:
      operationId: dispatchNextBuildJob
      responses:
        '200': { description: Dispatch result }
  /agent/v1/heartbeat:
    post:
      operationId: agentHeartbeat
      responses:
        '200': { description: Heartbeat accepted }
        '401': { description: Invalid node credential }
  /agent/v1/jobs/next:
    get:
      operationId: agentNextJob
      responses:
        '200': { description: Assignment or empty result }
  /agent/v1/jobs/{id}/started:
    post:
      operationId: agentStartJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Job started }
        '409': { description: No active lease }
  /agent/v1/jobs/{id}/lease:
    post:
      operationId: agentRenewLease
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Lease renewed }
        '409': { description: Lease expired }
  /agent/v1/jobs/{id}/complete:
    post:
      operationId: agentCompleteJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Job completed }
        '409': { description: No active lease }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
