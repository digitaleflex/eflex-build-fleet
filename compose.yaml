services:
  postgres:
    image: postgres:17-alpine
    container_name: eflex-build-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildfleet}
      POSTGRES_USER: ${POSTGRES_USER:-eflex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - build_fleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eflex} -d ${POSTGRES_DB:-buildfleet}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  build_fleet_postgres_data:
